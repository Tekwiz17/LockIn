name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Check session and rule behavior
        run: dotnet run --project windows/LockIn.CoreTests/LockIn.CoreTests.csproj --configuration Release
      - name: Publish self-contained EXE
        run: dotnet publish windows/LockIn.Windows/LockIn.Windows.csproj --configuration Release --runtime ${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false --output publish/${{ matrix.arch }}
      - name: Launch the published x64 EXE and check native startup
        if: matrix.arch == 'win-x64'
        shell: pwsh
        run: |
          $info = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path 'publish/win-x64/LockIn.exe'))
          $info.ArgumentList.Add('--smoke-test')
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($info)
          if (-not $process.WaitForExit(60000)) {
            $process.Kill($true)
            throw 'Published EXE startup check timed out.'
          }
          Write-Host $process.StandardOutput.ReadToEnd()
          Write-Host $process.StandardError.ReadToEnd()
          if ($process.ExitCode -ne 0) { throw "Published EXE startup failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: LockIn-Windows-${{ matrix.arch }}
          path: publish/${{ matrix.arch }}/LockIn.exe
          if-no-files-found: error
          retention-days: 30
